name: Validate changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run render:still
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: |
            out/*.png
            test-results/
